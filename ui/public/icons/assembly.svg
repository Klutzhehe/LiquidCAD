  <!-- Plus Badge at top-right -->
  <circle cx="37" cy="11" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2.2" />
  <line x1="37" y1="7" x2="37" y2="15" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
