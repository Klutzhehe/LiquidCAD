<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Cutting boundary line -->
  <line x1="8" y1="22" x2="40" y2="22" stroke="#f8fafc" stroke-width="2.8" stroke-linecap="round" />
  <!-- Kept solid segment -->
  <line x1="24" y1="8" x2="24" y2="22" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <!-- Trimmed dashed segment -->
  <line x1="24" y1="22" x2="24" y2="40" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="3 3" stroke-linecap="round" />
  <!-- CAD Trim Scissors -->
  <circle cx="34" cy="34" r="3.6" stroke="#38bdf8" stroke-width="2.2" fill="none" />
  <circle cx="18" cy="36" r="3.6" stroke="#38bdf8" stroke-width="2.2" fill="none" />
  <line x1="31" y1="31" x2="16" y2="14" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="20" y1="33" x2="30" y2="16" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" />
  <!-- Scissors pivot pin -->
  <circle cx="24" cy="22" r="2.5" fill="#f8fafc" />
</svg>
