<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Reference circle -->
  <circle cx="18" cy="24" r="12" stroke="#f8fafc" stroke-width="2.6" fill="none" />
  <circle cx="18" cy="24" r="2.5" fill="#f8fafc" />
  <!-- Radius guide to tangency -->
  <line x1="18" y1="24" x2="30" y2="24" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2 2" />
  <!-- Vertical tangent line -->
  <line x1="30" y1="8" x2="30" y2="40" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <!-- Tangency contact point -->
  <circle cx="30" cy="24" r="3.5" fill="#38bdf8" />
  <!-- Tangency halo -->
  <circle cx="30" cy="24" r="6.5" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="2 2" fill="none" />
</svg>
