<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- 3 Linear Array Instances -->
  <!-- Instance 1: Primary Seed (Cyan) -->
  <rect x="6" y="13" width="9.5" height="19" rx="2.5" fill="#38bdf8" fill-opacity="0.28" stroke="#38bdf8" stroke-width="2.6" />
  <!-- Instance 2: Pattern Copy 1 (White) -->
  <rect x="19.25" y="13" width="9.5" height="19" rx="2.5" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.6" />
  <!-- Instance 3: Pattern Copy 2 (White) -->
  <rect x="32.5" y="13" width="9.5" height="19" rx="2.5" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Direction Vector Arrow along pattern pitch -->
  <line x1="7" y1="38" x2="41" y2="38" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" />
  <polyline points="36,34 41,38 36,42" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Pitch tick marks -->
  <circle cx="10.75" cy="38" r="2" fill="#38bdf8" />
  <circle cx="24" cy="38" r="2" fill="#38bdf8" />
  <circle cx="37.25" cy="38" r="2" fill="#38bdf8" />
</svg>
