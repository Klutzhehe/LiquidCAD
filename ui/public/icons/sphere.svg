<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Polar Axis -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 2" stroke-linecap="round" />

  <!-- Sphere Body Contour & Volumetric Fill -->
  <circle cx="24" cy="24" r="16.5" fill="#38bdf8" fill-opacity="0.14" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Equatorial Reference Plane (Back half - hidden behind sphere) -->
  <path d="M 7.5 24 C 7.5 18 40.5 18 40.5 24" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 2" fill="none" />

  <!-- Equatorial Active Feature Rim (Front half - in front of sphere) -->
  <path d="M 7.5 24 C 7.5 30 40.5 30 40.5 24" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" fill="none" />

  <!-- Specular 3D Volumetric Highlight -->
  <ellipse cx="19" cy="18" rx="4.5" ry="3" transform="rotate(-30 19 18)" fill="#f8fafc" fill-opacity="0.25" />
</svg>