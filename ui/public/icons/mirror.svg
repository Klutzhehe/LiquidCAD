<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Central Datum Mirror Plane -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="3 2" stroke-linecap="round" />

  <!-- Left: Source 3D Body (Wedge Block) -->
  <polygon points="19,13 8,19 8,31 19,37" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.6" stroke-linejoin="round" />
  <polygon points="19,13 13,9 8,19" fill="#38bdf8" fill-opacity="0.35" stroke="#38bdf8" stroke-width="2.4" stroke-linejoin="round" />
  <line x1="13" y1="9" x2="13" y2="24" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />

  <!-- Right: Mirrored 3D Body (Reflected) -->
  <polygon points="29,13 40,19 40,31 29,37" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />
  <polygon points="29,13 35,9 40,19" fill="#f8fafc" fill-opacity="0.18" stroke="#f8fafc" stroke-width="2.4" stroke-linejoin="round" />
  <line x1="35" y1="9" x2="35" y2="24" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />

  <!-- Horizontal reflection connector vector -->
  <line x1="17" y1="25" x2="31" y2="25" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <polyline points="19,23 17,25 19,27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="29,23 31,25 29,27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
