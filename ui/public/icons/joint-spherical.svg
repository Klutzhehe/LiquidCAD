<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Outer socket housing cup grasping the ball -->
  <path d="M13 22 A 13 13 0 0 0 35 22 L 37 34 L 11 34 Z" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.8" stroke-linejoin="round" />
  <line x1="24" y1="34" x2="24" y2="44" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="18" y1="44" x2="30" y2="44" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" />

  <!-- Inner spherical ball head (3 rotational DOFs) -->
  <circle cx="24" cy="18" r="9" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.8" />
  <!-- Swiveling ball stud / stem -->
  <line x1="24" y1="9" x2="24" y2="4" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <circle cx="24" cy="4" r="2.5" fill="#38bdf8" />

  <!-- Multi-axis spherical rotation orbit arrows -->
  <path d="M18 18 A 6 3 0 0 0 30 18" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <polyline points="28,16 30.5,18 28,20" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#38bdf8" />
</svg>
