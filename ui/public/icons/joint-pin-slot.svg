<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Elongated slot body -->
  <rect x="6" y="14" width="36" height="20" rx="10" fill="#f8fafc" fill-opacity="0.08" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Slot guide centerline -->
  <line x1="16" y1="24" x2="32" y2="24" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" />

  <!-- Cylindrical pin (2 DOFs: slide + spin) -->
  <circle cx="16" cy="24" r="6.5" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.8" />
  <circle cx="16" cy="24" r="2" fill="#f8fafc" />

  <!-- Linear translation arrow along slot -->
  <line x1="23" y1="24" x2="36" y2="24" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" />
  <polyline points="32,20.5 36,24 32,27.5" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Rotation sweep arc around pin -->
  <path d="M12 20 A 5.5 5.5 0 0 1 20 20" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <polyline points="19,17 21,20.5 17.5,21.5" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="#38bdf8" />
</svg>
