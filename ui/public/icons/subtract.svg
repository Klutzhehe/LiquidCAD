<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Main solid body outline with stepped notch removed -->
  <polygon points="24,6.5 40,15.5 40,30.5 24,39.5 8,30.5 8,15.5" fill="#f8fafc" fill-opacity="0.08" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />
  <line x1="8" y1="15.5" x2="16" y2="20" stroke="#f8fafc" stroke-width="2.6" />
  <line x1="8" y1="30.5" x2="16" y2="35" stroke="#f8fafc" stroke-width="2.6" />
  <line x1="24" y1="39.5" x2="24" y2="31" stroke="#f8fafc" stroke-width="2.6" />
  <line x1="40" y1="15.5" x2="24" y2="24.5" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Carved-out Pocket / Negative Volume Faces -->
  <polygon points="16,20 24,24.5 24,31 16,26.5" fill="#f43f5e" fill-opacity="0.28" stroke="#f43f5e" stroke-width="2.6" stroke-linejoin="round" />
  <polygon points="16,26.5 24,31 16,35 8,30.5" fill="#f43f5e" fill-opacity="0.38" stroke="#f43f5e" stroke-width="2.4" stroke-linejoin="round" />
  <polyline points="24,24.5 32,20 32,26.5 24,31" stroke="#f43f5e" stroke-width="2.2" stroke-linejoin="round" />

  <!-- Phantom ghost of subtracted tool body -->
  <polygon points="16,11 24,15.5 16,20 8,15.5" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 2" fill="none" stroke-linejoin="round" />
  <line x1="16" y1="11" x2="16" y2="20" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3 2" />
</svg>
