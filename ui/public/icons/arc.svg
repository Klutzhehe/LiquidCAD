<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Chord reference line -->
  <line x1="8" y1="32" x2="40" y2="32" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 2" />
  <!-- 3-point circular arc -->
  <path d="M8 32 A16 16 0 0 1 40 32" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <!-- Center point marker -->
  <circle cx="24" cy="32" r="2" fill="#94a3b8" />
  <!-- Point 1 (Start) -->
  <circle cx="8" cy="32" r="3.5" fill="#f8fafc" />
  <!-- Point 2 (Peak) -->
  <circle cx="24" cy="16" r="3.5" fill="#f8fafc" />
  <!-- Point 3 (End) -->
  <circle cx="40" cy="32" r="3.5" fill="#f8fafc" />
</svg>
