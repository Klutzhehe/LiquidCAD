<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Rectangle body -->
  <rect x="9" y="11" width="30" height="26" rx="2" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="3" stroke-linejoin="round" />
  <!-- 2-point corner construction line -->
  <line x1="9" y1="11" x2="39" y2="37" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 2" />
  <!-- Defining corner anchor dots -->
  <circle cx="9" cy="11" r="3.5" fill="#f8fafc" />
  <circle cx="39" cy="37" r="3.5" fill="#f8fafc" />
</svg>
