<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Central mirror axis -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#94a3b8" stroke-width="2.4" stroke-dasharray="3 2" stroke-linecap="round" />
  <line x1="21" y1="4" x2="27" y2="4" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="21" y1="44" x2="27" y2="44" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />

  <!-- Left: Source 2D Asymmetric L-profile -->
  <polygon points="8,14 18,14 18,23 13,23 13,34 8,34" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.8" stroke-linejoin="round" />

  <!-- Right: Mirrored 2D L-profile -->
  <polygon points="40,14 30,14 30,23 35,23 35,34 40,34" fill="#f8fafc" fill-opacity="0.08" stroke="#f8fafc" stroke-width="2.8" stroke-linejoin="round" />

  <!-- Dashed reflection tie lines -->
  <line x1="18" y1="14" x2="30" y2="14" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2 2" />
  <line x1="13" y1="34" x2="35" y2="34" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2 2" />
</svg>
