<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Rounded rectangle body -->
  <rect x="8" y="11" width="32" height="26" rx="8" fill="#38bdf8" fill-opacity="0.16" stroke="#38bdf8" stroke-width="3" />
  <!-- Corner radius projection guide -->
  <path d="M32 11h8v8" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2 2" fill="none" stroke-linejoin="round" />
  <!-- Radius center dot -->
  <circle cx="32" cy="19" r="2" fill="#94a3b8" />
  <!-- Radius vector to fillet curve -->
  <line x1="32" y1="19" x2="37.6" y2="13.4" stroke="#f8fafc" stroke-width="1.8" stroke-linecap="round" />
  <!-- Defining anchor vertex dots -->
  <circle cx="8" cy="19" r="3.2" fill="#f8fafc" />
  <circle cx="40" cy="27" r="3.2" fill="#f8fafc" />
</svg>
