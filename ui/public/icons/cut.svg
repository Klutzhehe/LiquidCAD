<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Solid body base and faces -->
  <polygon points="24,6.5 40,15.5 24,24.5 8,15.5" fill="#f8fafc" fill-opacity="0.08" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />
  <polygon points="8,15.5 24,24.5 24,39.5 8,30.5" fill="#f8fafc" fill-opacity="0.05" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />
  <polygon points="24,24.5 40,15.5 40,30.5 24,39.5" fill="#f8fafc" fill-opacity="0.12" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Negative Cutout Pocket Cavity -->
  <!-- Top entrance profile -->
  <polygon points="18,12 28,17.5 24,20 14,14.5" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Bottom floor of pocket -->
  <polygon points="18,20 28,25.5 24,28 14,22.5" fill="#f43f5e" fill-opacity="0.3" stroke="#f43f5e" stroke-width="2.2" stroke-linejoin="round" />
  <!-- Pocket vertical walls -->
  <line x1="14" y1="14.5" x2="14" y2="22.5" stroke="#f43f5e" stroke-width="2.2" />
  <line x1="24" y1="20" x2="24" y2="28" stroke="#f43f5e" stroke-width="2.2" />
  <line x1="28" y1="17.5" x2="28" y2="25.5" stroke="#f43f5e" stroke-width="2.2" />

  <!-- Downward Cutting Direction Arrow -->
  <line x1="21" y1="3" x2="21" y2="13" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <polyline points="17,9 21,14 25,9" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
