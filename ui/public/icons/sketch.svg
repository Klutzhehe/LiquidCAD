<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Drafting plane / grid datum axes -->
  <path d="M10 38h28M10 38V10" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="3 3" />
  <!-- Grid datum origin dot -->
  <circle cx="10" cy="38" r="3" fill="#94a3b8" />
  <!-- Drawn active sketch contour -->
  <path d="M10 38C13 28 17 25 23 25" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <!-- Vertex anchor on the drawn path -->
  <circle cx="16" cy="31" r="3" fill="#f8fafc" />
  <!-- Drafting Stylus / Pencil angled at 45 degrees -->
  <path d="M24 20l9-9 4 4-9 9-5 1 1-5z" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Pencil collar band -->
  <line x1="30" y1="14" x2="34" y2="18" stroke="#f8fafc" stroke-width="2" stroke-linecap="round" />
  <!-- Stylus tip / lead touching the curve -->
  <polygon points="24,20 23,25 28,24" fill="#f8fafc" />
</svg>
