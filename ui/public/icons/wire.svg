<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Multi-segment connected polyline -->
  <path d="M8 36 L19 14 L30 32 L40 12" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <!-- Vertex anchor dots at each joint -->
  <circle cx="8" cy="36" r="3.5" fill="#f8fafc" />
  <circle cx="19" cy="14" r="3.5" fill="#f8fafc" />
  <circle cx="30" cy="32" r="3.5" fill="#f8fafc" />
  <circle cx="40" cy="12" r="3.5" fill="#f8fafc" />
  <!-- Continuation snap guide -->
  <line x1="40" y1="12" x2="45" y2="20" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2 2" />
</svg>
