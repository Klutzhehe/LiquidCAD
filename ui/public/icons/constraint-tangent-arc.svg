<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Connecting centerline -->
  <line x1="16" y1="24" x2="34" y2="24" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="2 2" />
  <!-- Left circle -->
  <circle cx="16" cy="24" r="10" stroke="#f8fafc" stroke-width="2.6" fill="none" />
  <circle cx="16" cy="24" r="2" fill="#f8fafc" />
  <!-- Right circle -->
  <circle cx="34" cy="24" r="8" stroke="#38bdf8" stroke-width="3" fill="#38bdf8" fill-opacity="0.12" />
  <circle cx="34" cy="24" r="2" fill="#38bdf8" />
  <!-- Tangency contact point -->
  <circle cx="26" cy="24" r="3.5" fill="#38bdf8" />
  <!-- Tangency halo -->
  <circle cx="26" cy="24" r="6" stroke="#38bdf8" stroke-width="1.6" stroke-dasharray="2 2" fill="none" />
</svg>
