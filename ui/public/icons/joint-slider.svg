<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Linear guide rail shaft -->
  <line x1="6" y1="24" x2="42" y2="24" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  <!-- Limit stops at ends -->
  <line x1="6" y1="19" x2="6" y2="29" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" />
  <line x1="42" y1="19" x2="42" y2="29" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" />

  <!-- Sliding carriage block -->
  <rect x="16" y="14" width="16" height="20" rx="3" fill="#f8fafc" fill-opacity="0.12" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Bidirectional sliding motion arrows (1 translational DOF) -->
  <line x1="11" y1="24" x2="37" y2="24" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
  <polyline points="14,20 10,24 14,28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="34,20 38,24 34,28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
</svg>
