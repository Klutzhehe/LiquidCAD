<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Upper mating flange -->
  <rect x="9" y="14" width="30" height="9" rx="2" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.6" />
  <!-- Lower mating flange -->
  <rect x="9" y="25" width="30" height="9" rx="2" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Fastener padlock locking both flanges rigidly (0 DOFs) -->
  <!-- Padlock shackle -->
  <path d="M19 19v-6a5 5 0 0 1 10 0v6" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <!-- Padlock body -->
  <rect x="16" y="19" width="16" height="15" rx="3" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.6" />
  <!-- Keyhole / rigid fastener mark -->
  <circle cx="24" cy="25" r="2" fill="#38bdf8" />
  <line x1="24" y1="26" x2="24" y2="30" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
</svg>
