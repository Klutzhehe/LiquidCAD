<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Outer Solid Body Container -->
  <polygon points="24,6.5 41,15.5 41,32.5 24,41.5 7,32.5 7,15.5" fill="#f8fafc" fill-opacity="0.06" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />
  <!-- Center vertical front crease -->
  <line x1="24" y1="24.5" x2="24" y2="41.5" stroke="#f8fafc" stroke-width="2.4" stroke-linecap="round" />

  <!-- Open Top Wall Rim (Wall Thickness t) -->
  <polygon points="24,11 36,17.5 24,24 12,17.5" fill="#38bdf8" fill-opacity="0.25" stroke="#38bdf8" stroke-width="2.6" stroke-linejoin="round" />
  <line x1="7" y1="15.5" x2="12" y2="17.5" stroke="#f8fafc" stroke-width="2" />
  <line x1="24" y1="6.5" x2="24" y2="11" stroke="#f8fafc" stroke-width="2" />
  <line x1="41" y1="15.5" x2="36" y2="17.5" stroke="#f8fafc" stroke-width="2" />

  <!-- Interior Hollow Cavity Depth -->
  <line x1="12" y1="17.5" x2="12" y2="29" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="24" y1="24" x2="24" y2="35.5" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <line x1="36" y1="17.5" x2="36" y2="29" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" />
  <!-- Interior floor -->
  <polyline points="12,29 24,35.5 36,29" stroke="#38bdf8" stroke-width="2.2" stroke-linejoin="round" fill="none" />
</svg>
