<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">

  <!-- 4-way direction cross -->
  <line x1="24" y1="8" x2="24" y2="40" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" />
  <line x1="8" y1="24" x2="40" y2="24" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" />
  <!-- Up -->
  <polyline points="20,12 24,8 28,12" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Down -->
  <polyline points="20,36 24,40 28,36" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left -->
  <polyline points="12,20 8,24 12,28" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right -->
  <polyline points="36,20 40,24 36,28" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="24" cy="24" r="3" fill="#f8fafc" />

</svg>