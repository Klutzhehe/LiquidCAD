<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Base Sketch Profile (Dashed rear reference edges) -->
  <path d="M 7 35 L 24 28 L 41 35" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3 2" stroke-linejoin="round" />
  
  <!-- Extruded Body Volume -->
  <!-- Left Side Face -->
  <polygon points="7,22 24,29 24,42 7,35" fill="#f8fafc" fill-opacity="0.06" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right Side Face -->
  <polygon points="24,29 41,22 41,35 24,42" fill="#f8fafc" fill-opacity="0.14" stroke="#f8fafc" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Active Extruded Top Face -->
  <polygon points="24,14 41,22 24,29 7,22" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Active Extrusion Vector (Pull arrow from face upward) -->
  <line x1="24" y1="21.5" x2="24" y2="4.5" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" />
  <polyline points="18.5,10 24,4 29.5,10" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>