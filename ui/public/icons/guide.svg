<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Secondary perpendicular dashed guide -->
  <line x1="16" y1="16" x2="32" y2="32" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 3" stroke-linecap="round" />
  <!-- Main centerline guideline (long dash, dot, long dash) -->
  <line x1="8" y1="40" x2="40" y2="8" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="8 4 2 4" />
  <!-- Intersection anchor dot -->
  <circle cx="24" cy="24" r="3.5" fill="#38bdf8" />
  <!-- Guideline anchor dots -->
  <circle cx="14" cy="34" r="3" fill="#f8fafc" />
  <circle cx="34" cy="14" r="3" fill="#f8fafc" />
</svg>
