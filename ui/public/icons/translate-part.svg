<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- 4-way direction translation cross -->
  <line x1="24" y1="9" x2="24" y2="39" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" />
  <line x1="9" y1="24" x2="39" y2="24" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" />

  <!-- Up arrow -->
  <polyline points="19.5,13.5 24,9 28.5,13.5" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Down arrow -->
  <polyline points="19.5,34.5 24,39 28.5,34.5" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Left arrow -->
  <polyline points="13.5,19.5 9,24 13.5,28.5" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Right arrow -->
  <polyline points="34.5,19.5 39,24 34.5,28.5" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Central origin hub -->
  <circle cx="24" cy="24" r="3.5" fill="#f8fafc" />
</svg>
