<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Top parallel plate -->
  <polygon points="8,10 32,10 38,18 14,18" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Bottom parallel plate -->
  <polygon points="10,30 34,30 40,38 16,38" fill="#f8fafc" fill-opacity="0.1" stroke="#f8fafc" stroke-width="2.6" stroke-linejoin="round" />

  <!-- Parallel constraint symbol '//' -->
  <line x1="20" y1="21" x2="25" y2="27" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <line x1="26" y1="21" x2="31" y2="27" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />

  <!-- Perpendicular reference dashed tie line -->
  <line x1="16" y1="18" x2="16" y2="30" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" />
</svg>
