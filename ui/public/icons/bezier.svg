<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Control polygon tangent arms -->
  <line x1="8" y1="36" x2="16" y2="14" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2.5 2" />
  <line x1="40" y1="36" x2="32" y2="14" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="2.5 2" />
  <!-- Cubic Bézier curve -->
  <path d="M8 36 C 14 10, 34 10, 40 36" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" fill="none" />
  <!-- Control pole handles (diamonds) -->
  <rect x="13.5" y="11.5" width="5" height="5" transform="rotate(45 16 14)" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5" />
  <rect x="29.5" y="11.5" width="5" height="5" transform="rotate(45 32 14)" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Endpoints -->
  <circle cx="8" cy="36" r="3.5" fill="#f8fafc" />
  <circle cx="40" cy="36" r="3.5" fill="#f8fafc" />
</svg>
