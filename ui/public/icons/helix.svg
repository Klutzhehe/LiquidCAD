<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Central Helix Axis -->
  <line x1="24" y1="4" x2="24" y2="44" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" stroke-linecap="round" />

  <!-- Turn 1 (Bottom) Rear Loop (Passes behind axis) -->
  <path d="M 36 34.5 C 36 31 24 30 12 30" stroke="#f8fafc" stroke-width="2.2" stroke-opacity="0.6" stroke-linecap="round" fill="none" />
  <!-- Turn 1 Front Loop (Passes in front of axis) -->
  <path d="M 12 39 C 12 43 36 41 36 34.5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Turn 2 (Middle) Rear Loop (Passes behind axis) -->
  <path d="M 36 24.5 C 36 21 24 20 12 20" stroke="#f8fafc" stroke-width="2.2" stroke-opacity="0.6" stroke-linecap="round" fill="none" />
  <!-- Turn 2 Front Loop (Passes in front of axis) -->
  <path d="M 12 30 C 12 34 36 31 36 24.5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Turn 3 (Top) Rear Loop (Passes behind axis) -->
  <path d="M 36 14.5 C 36 11 24 10 12 10" stroke="#f8fafc" stroke-width="2.2" stroke-opacity="0.6" stroke-linecap="round" fill="none" />
  <!-- Turn 3 Front Loop (Passes in front of axis) -->
  <path d="M 12 20 C 12 24 36 21 36 14.5" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />

  <!-- Top Winding Direction Vector Arrow -->
  <path d="M 12 10 C 12 7.5 17 6 22 6" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" fill="none" />
  <polyline points="18,3 23,6 18,9" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>