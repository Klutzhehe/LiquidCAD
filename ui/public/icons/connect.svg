<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Converging segments -->
  <line x1="9" y1="13" x2="24" y2="24" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="39" y1="13" x2="24" y2="24" stroke="#f8fafc" stroke-width="3" stroke-linecap="round" />
  <line x1="24" y1="24" x2="24" y2="39" stroke="#38bdf8" stroke-width="3.2" stroke-linecap="round" />
  <!-- Concentric snap ring -->
  <circle cx="24" cy="24" r="8.5" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="3 2" fill="none" />
  <!-- Shared coincident vertex anchor dot -->
  <circle cx="24" cy="24" r="4" fill="#38bdf8" />
  <!-- Segment endpoint dots -->
  <circle cx="9" cy="13" r="3" fill="#f8fafc" />
  <circle cx="39" cy="13" r="3" fill="#f8fafc" />
  <circle cx="24" cy="39" r="3" fill="#f8fafc" />
</svg>
