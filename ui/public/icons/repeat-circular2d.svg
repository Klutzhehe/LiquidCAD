<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="96" height="96" fill="none">
  <!-- Circular pattern orbit path -->
  <circle cx="24" cy="24" r="15.5" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3 2" fill="none" />
  <!-- Center rotation pivot -->
  <circle cx="24" cy="24" r="3" fill="#38bdf8" />

  <!-- 4 Pattern Nodes -->
  <!-- Seed Node (Top) -->
  <circle cx="24" cy="8.5" r="4.5" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.8" />
  <!-- Right Node -->
  <circle cx="39.5" cy="24" r="4.5" fill="#f8fafc" fill-opacity="0.12" stroke="#f8fafc" stroke-width="2.6" />
  <!-- Bottom Node -->
  <circle cx="24" cy="39.5" r="4.5" fill="#f8fafc" fill-opacity="0.12" stroke="#f8fafc" stroke-width="2.6" />
  <!-- Left Node -->
  <circle cx="8.5" cy="24" r="4.5" fill="#f8fafc" fill-opacity="0.12" stroke="#f8fafc" stroke-width="2.6" />

  <!-- Curved angular sweep arrow -->
  <path d="M29 9.5 A 15.5 15.5 0 0 1 38 18" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" fill="none" />
  <polyline points="34,18 38,18 38,14" stroke="#38bdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
